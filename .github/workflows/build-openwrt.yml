name: Build Heleguo LEDE 360 T6GS

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: SSH connection to Actions
        required: false
        default: 'false'

permissions:
  contents: read
  actions: write

env:
  REPO_URL: https://github.com/Heleguo/lede
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
        echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> "$GITHUB_ENV"

    - name: Install native board definition
      run: |
        chmod +x "$DIY_P1_SH"
        cd "$OPENWRT_PATH"
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

        test "$(grep -c '^define Device/qihoo_360t6gs$' target/linux/ramips/image/mt7621.mk)" -eq 1
        test "$(grep -c '^TARGET_DEVICES += qihoo_360t6gs$' target/linux/ramips/image/mt7621.mk)" -eq 1
        grep -q '^&nand {' target/linux/ramips/dts/mt7621_qihoo_360t6gs.dts
        ! grep -q 'jedec,spi-nor' target/linux/ramips/dts/mt7621_qihoo_360t6gs.dts
        ! grep -q '360_360t6gs' target/linux/ramips/image/mt7621.mk

    - name: Update feeds
      run: cd "$OPENWRT_PATH" && ./scripts/feeds update -a

    - name: Install feeds
      run: cd "$OPENWRT_PATH" && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cp "$CONFIG_FILE" "$OPENWRT_PATH/.config"
        chmod +x "$DIY_P2_SH"
        cd "$OPENWRT_PATH"
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

        grep -qx 'CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=y' .config
        test "$(grep -c '^CONFIG_TARGET_ramips_mt7621_DEVICE_.*=y$' .config)" -eq 1

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: github.event.inputs.ssh == 'true'
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download packages
      run: |
        cd "$OPENWRT_PATH"
        make defconfig
        test "$(grep -c '^CONFIG_TARGET_ramips_mt7621_DEVICE_.*=y$' .config)" -eq 1
        grep -qx 'CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=y' .config
        ! grep -q 'adslr_g7\|360_360t6gs' .config
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      id: compile
      run: |
        cd "$OPENWRT_PATH"
        make V=s -j1
        grep -qx 'CONFIG_TARGET_ramips_mt7621_DEVICE_qihoo_360t6gs=y' .config
        test -f bin/targets/ramips/mt7621/*qihoo_360t6gs*firmware.bin
        grep -RIl 'qihoo_360t6gs' bin/targets/ramips/mt7621 | head
        echo "DEVICE_NAME=_qihoo_360t6gs" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd "$OPENWRT_PATH/bin/targets/ramips/mt7621"
        rm -rf packages
        find . -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
        test "$(find . -maxdepth 1 -type f -name '*qihoo_360t6gs*' | wc -l)" -gt 0
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      continue-on-error: true
      with:
        retain_days: 1
        keep_minimum_runs: 3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
